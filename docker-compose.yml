version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ahsan_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-ahsan_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-AhsanSecureMongoPass2026!}
      MONGO_INITDB_DATABASE: AHSAN_AI_LABS
    ports:
      # Bound strictly to localhost/internal container network - NEVER exposed to public internet
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ahsan_internal_net

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  ahsan_internal_net:
    driver: bridge
